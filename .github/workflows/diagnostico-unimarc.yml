name: Diagnóstico fuentes Unimarc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostico_unimarc_fuentes.py"
      - ".github/workflows/diagnostico-unimarc.yml"

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python diagnostico_unimarc_fuentes.py
