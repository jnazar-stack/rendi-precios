name: Catálogo de alimentos

on:
  schedule:
    - cron: "5 7 * * *"   # 07:05 de Chile, después de los precios del menú
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      cuantos:
        description: "Cuántos alimentos leer (vacío = todos)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Leer catálogo
        run: python catalogo.py ${{ github.event.inputs.cuantos }}
      - name: Guardar
        run: |
          git config user.name "rendi-precios"
          git config user.email "actions@users.noreply.github.com"
          git add catalogo.json ean_vtex.json registro_catalogo.txt
          git diff --cached --quiet || git commit -m "Catálogo $(TZ=America/Santiago date +%F)"
          git pull --rebase -q && git push
