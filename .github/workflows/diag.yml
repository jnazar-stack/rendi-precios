name: Diagnóstico nutrición
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python diag_nutri.py
      - run: |
          git config user.name "rendi-precios"
          git config user.email "actions@users.noreply.github.com"
          git add diag_nutri.txt diag_tablas.html
          git commit -m "Diagnóstico nutrición" && git pull --rebase -q && git push
