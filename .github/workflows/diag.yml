name: Diagnóstico (una vez)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python diag/diag.py > diag/salida.txt 2>&1 || true
      - run: |
          git config user.name "rendi-precios"
          git config user.email "actions@users.noreply.github.com"
          git add diag/salida.txt && git commit -m "Resultado del diagnóstico" && git pull --rebase -q && git push
