name: Diagnóstico navegador (manual)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["diagnostico_navegador.py", "actualizar.py", ".github/workflows/diagnostico-navegador.yml"]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: python -m playwright install --with-deps chromium
      - name: Consultar una página por cadena
        run: python diagnostico_navegador.py
