name: Probar Tottus público

on:
  workflow_dispatch:
  push:
    branches: [experiment/tottus-fuentes-publicas]
    paths: ["diagnostico_tottus_fuentes.py", ".github/workflows/diagnostico-tottus.yml"]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - run: python diagnostico_tottus_fuentes.py
