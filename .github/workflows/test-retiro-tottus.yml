name: Verificar retiro de Tottus

on:
  push:
    branches: [fix/quitar-tottus-piloto]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m unittest discover -s tests -v
