name: Validar lectura Unimarc Chromium

on:
  workflow_dispatch:
  push:
    branches: [feature/unimarc-browser]
    paths:
      - "unimarc_browser.py"
      - "actualizar.py"
      - "prueba_unimarc_catalogo.py"
      - "tests/**"
      - ".github/workflows/diario.yml"
      - ".github/workflows/validar-unimarc-browser.yml"

concurrency:
  group: unimarc-browser-prueba
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Validar catálogo completo de Unimarc
        run: python prueba_unimarc_catalogo.py
