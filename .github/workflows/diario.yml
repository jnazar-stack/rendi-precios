name: Precios del día

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 de Chile, verano e invierno
      timezone: "America/Santiago"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["actualizar.py", ".github/workflows/diario.yml"]

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Comprobar control de bloqueos
        run: python -m unittest discover -s tests -v
      - name: Leer precios
        run: python actualizar.py
      - name: Guardar
        run: |
          git config user.name "rendi-precios"
          git config user.email "actions@users.noreply.github.com"
          git add precios.json registro.txt
          git diff --cached --quiet || git commit -m "Precios $(TZ=America/Santiago date +%F)"
          git pull --rebase -q && git push
