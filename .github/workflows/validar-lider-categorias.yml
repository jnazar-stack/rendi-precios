name: Validar lectura pública Líder (rama)

on:
  push:
    branches: ["feature/lider-categorias-publicas"]
    paths:
      - "actualizar.py"
      - "diagnostico_categorias_lider.py"
      - "tests/**"
      - ".github/workflows/validar-lider-categorias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: python diagnostico_categorias_lider.py
