name: Suplementos

on:
  schedule:
    - cron: "40 7 * * *"   # 07:40 de Chile
      timezone: "America/Santiago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  suplementos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Leer suplementos
        run: python suplementos.py
      - name: Guardar
        run: |
          git config user.name "rendi-precios"
          git config user.email "actions@users.noreply.github.com"
          git add suplementos.json registro_suplementos.txt
          git diff --cached --quiet || git commit -m "Suplementos $(TZ=America/Santiago date +%F)"
          git pull --rebase -q && git push
